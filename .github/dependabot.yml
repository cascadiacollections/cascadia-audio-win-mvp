version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7

  - package-ecosystem: "nuget"
    directories:
      - "/avalonia/CascadiaAudioMvp"
      - "/avalonia/CascadiaAudioMvp.Tests"
      - "/windows/CascadiaAudioMvp"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
